# Model routing — ONE place. Flip per-system via RESEARCH_PROVIDER env or edit here.
# local = MLX server :8800 (offline), openrouter = online API.
# Grounded 2026-10-11: :8800 is the ONLY live local model server.
# (Old pointers :8000 vLLM / :8768 gemma-MLX are dead — do not revive.)
#
# Contract: scripts/stamp-config.py renders `seats:` into agents/<seat>/models.json,
# `claude_seats:` + shared/topology.yaml into rig.yaml, and the MCP fragment.
# research/ live-reads `providers:` / `research:` below (keep those keys stable).

providers:
  local:
    api_base: http://127.0.0.1:8800/v1
    api_key: dummy
    api: openai-completions            # -> models.json "api"
    compat:                            # -> models.json "compat"
      supportsDeveloperRole: false
      supportsReasoningEffort: false
  openrouter:
    api_base: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    api: openai-completions
    compat:
      supportsDeveloperRole: true
      supportsReasoningEffort: false

research:
  provider: local            # flip to "openrouter" on online systems
  fast_model: qwen3-coder-30b
  smart_model: qwen3-coder-30b

coder:
  provider: local
  model: qwen3-coder-30b

# CR (code reader) — role-tuned gemma-4-e4b on the live MLX server :8800
# (qwen3-coder-30b = reserve swap on the same server).
code_reader:
  provider: local
  model: mlx-community/gemma-4-e4b-it-4bit
  api_base: http://127.0.0.1:8800/v1

# Vision (vision seat) — Qwen3-VL-8B, same live server :8800.
# (an earlier :8765 vision server is dead; VL-8B lives on :8800.)
vision:
  provider: local
  model: mlx-community/Qwen3-VL-8B-Instruct-4bit
  api_base: http://127.0.0.1:8800/v1

# ── pi seat pins → stamp renders agents/<seat>/models.json ──────────────────
# Flip a seat online: set `provider: openrouter` + swap the model id(s), run
# scripts/stamp-config.py, bounce the seat. The API key is pulled from
# ~/.config/myteams/config.local.yaml (never from this file).
# provider_id = the provider key inside models.json (kept for pin continuity).
seats:
  researcher-local:
    provider: local
    provider_id: vllm-local
    models:
      - id: mlx-community/Qwen3.6-35B-A3B-4bit
        name: Qwen3.6 35B Local
        maxTokens: 8192
        samplingParams:
          chat_template_kwargs:
            enable_thinking: false
          repetition_penalty: 1.2
          repetition_context_size: 256
      - id: qwen3-8b-local
        name: Qwen3 8B Local (fallback)
        maxTokens: 8192
        samplingParams:
          chat_template_kwargs:
            enable_thinking: false
          repetition_penalty: 1.2
          repetition_context_size: 256
  code-reader:
    provider: local
    provider_id: mlx-local
    models:
      - id: mlx-community/gemma-4-e4b-it-4bit
        name: Gemma 4 E4B (CR)
        maxTokens: 2048
      - id: mlx-community/Qwen3-Coder-30B-A3B-Instruct-4bit
        name: Qwen3 Coder 30B (reserve)
        maxTokens: 2048
  vision:
    provider: local
    provider_id: vlm-local
    models:
      - id: mlx-community/Qwen3-VL-8B-Instruct-4bit
        name: Qwen3 VL 8B (vision)
        maxTokens: 2048
  context-manager:
    provider: local
    provider_id: vllm-local
    models:
      - id: mlx-community/Qwen3-Coder-30B-A3B-Instruct-4bit
        name: Qwen3 Coder 30B Local
        maxTokens: 2048
      - id: Qwen/Qwen3-8B-MLX-4bit
        name: Qwen3 8B Local (fallback)
        maxTokens: 2048

# ── claude-code seat pins → stamp renders rig.yaml `model:` lines ──────────
claude_seats:
  director: openrouter/xiaomi/mimo-v2.6-pro
  tm-a: openrouter/xiaomi/mimo-v2.6-pro
  tm-b: openrouter/xiaomi/mimo-v2.6-pro
  tm-c: openrouter/xiaomi/mimo-v2.6-pro
  pd: openrouter/anthropic/claude-sonnet-5.5
  se: openrouter/deepseek/deepseek-v4.1-flash
  jd: openrouter/z-ai/glm-5.3-flash
  auditor: openrouter/deepseek/deepseek-v4-flash-0731
  verifier: openrouter/deepseek/deepseek-v4-flash-0731
