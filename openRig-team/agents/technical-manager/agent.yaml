name: technical-manager
version: "1.0"
description: Technical Manager — owns an assigned story end-to-end, coordinates implementation work, handles blockers, and reports completion to the Director.

defaults:
  runtime: claude-code

profiles:
  default:
    uses:
      skills: []
      guidance:
        - shared:context-discipline
      subagents: []
      plugins: []
      runtime_resources: []

imports:
  - ref: local:../shared

resources:
  guidance:
    - id: role
      path: guidance/role.md

startup:
  files:
    - path: guidance/role.md
      delivery_hint: send_text
      required: true
  actions: []
