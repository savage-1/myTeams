name: principal-dev
version: "1.0"
description: Principal Dev — hard reasoning, architecture, and root-cause analysis only. Never routine work.

defaults:
  runtime: claude-code

profiles:
  default:
    uses:
      skills: []
      guidance:
        - shared:context-discipline
      subagents: []
      plugins: []
      runtime_resources: []

imports:
  - ref: local:../shared

resources:
  guidance:
    - id: role
      path: guidance/role.md

startup:
  files:
    - path: guidance/role.md
      delivery_hint: send_text
      required: true
  actions: []
