name: context-manager
version: "1.0"
description: Context Manager — Cognee context layer (FEED/FETCH) for the project. Provenance-cited, read-only.

defaults:
  runtime: pi

lifecycle:
  compaction_strategy: default-compaction
  restore_policy: relaunch_fresh

profiles:
  default:
    uses:
      skills: []
      guidance:
        - shared:context-discipline
      subagents: []
      plugins: []
      runtime_resources: []

imports:
  - ref: local:../shared

resources:
  guidance:
    - id: role
      path: guidance/role.md

startup:
  files:
    - path: guidance/role.md
      delivery_hint: send_text
      required: true
  actions: []
