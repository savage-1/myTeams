name: researcher-local
version: "1.0"
description: Local Researcher — handles delegated research and code-inspection tasks using a local Pi runtime.

defaults:
  runtime: pi

lifecycle:
  compaction_strategy: default-compaction
  restore_policy: relaunch_fresh

profiles:
  default:
    uses:
      skills: []
      guidance:
        - shared:context-discipline
      subagents: []
      plugins: []
      runtime_resources: []

imports:
  - ref: local:../shared

resources:
  guidance:
    - id: role
      path: guidance/role.md

startup:
  files:
    - path: guidance/role.md
      delivery_hint: send_text
      required: true
  actions: []
