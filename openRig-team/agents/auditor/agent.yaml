name: auditor
version: "1.0"
description: Auditor — ONE prompt, 6 lenses (correctness|dod|policy|provenance|perf|fixtures-from-spec). Fail-closed gate.

defaults:
  runtime: claude-code

profiles:
  default:
    uses:
      skills: []
      guidance:
        - shared:context-discipline
      subagents: []
      plugins: []
      runtime_resources: []

imports:
  - ref: local:../shared

resources:
  guidance:
    - id: role
      path: guidance/role.md

startup:
  files:
    - path: guidance/role.md
      delivery_hint: send_text
      required: true
  actions: []
